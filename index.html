(()=>{const b=document.getElementById('fs'),de=document.documentElement,

  else{const r=req.call(de);const lk=()=>{try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})}catch(_){}};if(r&&r.then)r.then(lk).catch(()=>{});else lk()}}catch(_){}};
